name: DiagrammeR Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st at 00:00 UTC

jobs:
  diagrammer-docs:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          cache-version: 1
          packages: |
            any::DiagrammeR
            any::rmarkdown
            any::knitr
            any::webshot

      - name: Install PhantomJS for DiagrammeR
        run: |
          install.packages("webshot")
          webshot::install_phantomjs()
        shell: Rscript {0}

      - name: Render model architecture diagram
        run: |
          # Render the model architecture Rmd to HTML
          rmarkdown::render(
            "inst/model-architecture.Rmd",
            output_format = "html_document",
            output_dir = "docs"
          )
        shell: Rscript {0}

      - name: Upload documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-architecture-diagrams
          path: |
            docs/model-architecture.html
            docs/figure/