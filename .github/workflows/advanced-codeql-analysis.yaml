name: Advanced CodeQL Security Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  codeql-analysis:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: javascript, r
          config-file: ./.github/codeql-config.yml

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: 'release'

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Run R security checks
        run: |
          Rscript -e "
            # Check for common security issues in R code
            library(tools)

            # Scan for potentially dangerous functions
            r_files <- list.files('R/', pattern = '\\\\.R$', full.names = TRUE)
            dangerous_patterns <- c(
              'system\\\\(',
              'shell\\\\(',
              'eval\\\\(',
              'parse\\\\(',
              'source\\\\(',
              'readRDS\\\\(',
              'load\\\\('
            )

            for (file in r_files) {
              content <- readLines(file, warn = FALSE)
              for (pattern in dangerous_patterns) {
                matches <- grep(pattern, content, value = TRUE)
                if (length(matches) > 0) {
                  cat('⚠️  Potential security concern in', file, '\n')
                  for (match in matches) {
                    cat('   ', match, '\n')
                  }
                }
              }
            }
          "

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:javascript"
          upload: false

      - name: Perform CodeQL Analysis (R)
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:r"
          upload: false

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        if: always()
        with:
          sarif_file: results.sarif
