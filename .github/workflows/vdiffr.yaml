name: Vdiffr

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  vdiffr-visual-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          cache-version: 1
          packages: |
            any::vdiffr
            any::testthat
            any::ggplot2
            any::dplyr
            any::devtools

      - name: Install package
        run: |
          devtools::install(dependencies = TRUE)
        shell: Rscript {0}

      - name: Run visual tests
        run: |
          # Run tests with visual comparison
          testthat::test_local(filter = "visual")
        shell: Rscript {0}

      - name: Run vdiffr tests specifically
        run: |
          # Run vdiffr tests to catch visual changes
          if (require(vdiffr, quietly = TRUE)) {
            vdiffr::test_vdiffr()
          } else {
            message("vdiffr not available, skipping visual tests")
          }
        shell: Rscript {0}

      - name: Upload visual test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-test-results
          path: |
            tests/testthat/_snaps/
            testthat-results/