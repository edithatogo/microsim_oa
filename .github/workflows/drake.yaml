name: Drake Workflow

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at 00:00 UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  drake-workflow:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          cache-version: 1
          packages: |
            any::drake
            any::devtools
            any::dplyr

      - name: Install package
        run: |
          devtools::install(dependencies = TRUE)
        shell: Rscript {0}

      - name: Run Drake workflow
        run: |
          # Load the drake configuration
          source("inst/drake-config.R")
          
          # Run the workflow
          results <- run_workflow()
          
          # Print workflow summary
          drake::drake_status(make_plan())
        shell: Rscript {0}

      - name: Cache workflow results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drake-workflow-results
          path: .drake/