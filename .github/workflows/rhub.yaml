name: RHub

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  rhub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { os: 'ubuntu-20.04',  r: 'release', args: '--as-cran' }
          - { os: 'windows-x86_64', r: 'release', args: '--as-cran' }
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install rhub
        run: |
          install.packages("rhub")
        shell: Rscript {0}

      - name: Check with R-hub
        run: |
          rhub::check(
            platform = "${{ matrix.config.os }}",
            show_status = FALSE
          )
        shell: Rscript {0}
        env:
          RHUB_PLATFORMS: ${{ matrix.config.os }}